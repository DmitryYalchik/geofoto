<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ГеоФото">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b0f14">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>ГеоФото</title>
<style>
  :root {
    --bg: #0b0f14; --card: #151b23; --line: #232c37; --text: #e8edf2;
    --muted: #8a97a6; --accent: #2f8cff; --danger: #ff6b6b; --ok: #7fd48b;
    --top: env(safe-area-inset-top); --bottom: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* App-like: the page itself never scrolls, bounces or zooms; only marked areas scroll inside. */
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg);
    color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: text; user-select: text; font-size: 16px; } /* >= 16px: iOS does not zoom on focus */
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg);
    /* buttons may sit inside the home-indicator zone, just clear of the indicator itself */
    padding: calc(var(--top) + 6px) 16px max(12px, calc(var(--bottom) - 12px)); }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .grow { flex: 1; min-height: 0; }

  .bar { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-bottom: 8px; }
  .bar .back { border: 0; background: none; color: var(--accent); font-size: 17px; padding: 8px 8px 8px 0; min-width: 76px; text-align: left; }
  .bar .title { font-size: 17px; font-weight: 600; text-align: center; flex: 1; }
  .bar .step { min-width: 76px; text-align: right; color: var(--muted); font-size: 14px; }
  .bar .icon { border: 0; background: none; font-size: 22px; padding: 6px 0 6px 12px; min-width: 76px; text-align: right; color: var(--muted); }
  h1 { font-size: 26px; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 12px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 2px 14px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .label { color: var(--muted); flex: none; }
  .row .val { text-align: right; font-variant-numeric: tabular-nums; min-width: 0; }
  .row.col { flex-direction: column; gap: 2px; }
  .row.col .val { text-align: left; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .status { color: var(--danger); font-size: 14px; margin: 10px 2px 0; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px;
    border-radius: 16px; border: 0; background: var(--accent); color: #fff; font-size: 18px; font-weight: 600; }
  .btn:active, .opt:active { opacity: .75; }
  .btn:disabled { opacity: .35; }
  .btn.ghost { background: transparent; border: 1px solid var(--accent); color: var(--accent); font-size: 16px; padding: 13px; }
  .btn.gray { background: #2a323d; color: var(--text); font-size: 16px; padding: 14px; }
  .btn + .btn, .btns + .btn, .btn + .btns { margin-top: 10px; }
  .btns { display: flex; gap: 10px; }
  .btns .btn { margin-top: 0; }
  .link { border: 0; background: none; color: var(--accent); font-size: 15px; padding: 10px; }

  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px; border-radius: 16px; text-align: left;
    border: 1px solid var(--line); background: var(--card); font-size: 17px; }
  .opt .ico { font-size: 22px; width: 28px; text-align: center; }
  .opt.on { border-color: var(--accent); }
  .field { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .field:focus { outline: none; border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; align-content: start; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--card); border: 0; padding: 0; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb span { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 12px; padding: 1px 7px; border-radius: 8px; }
  .empty { color: var(--muted); text-align: center; margin-top: 30%; }

  .plate-input { width: 100%; padding: 18px 12px; border-radius: 16px; border: 2px solid var(--line); background: #fff; color: #111;
    font: 700 30px/1 Menlo, "Courier New", monospace; text-align: center; letter-spacing: 1px; text-transform: uppercase; }
  .plate-input:focus { outline: none; border-color: var(--accent); }
  .plate-input::placeholder { color: #b5bcc4; font-weight: 400; }
  .sugg { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .sugg button { padding: 9px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 15px; }
  .sugg button b { color: var(--accent); font-weight: 600; }
  .sugg button.recent::before { content: '↺ '; color: var(--muted); }
  .strip { display: flex; gap: 6px; overflow-x: auto; margin: 12px 0; }
  .strip img { height: 72px; border-radius: 8px; flex: none; }

  .done-ok { color: var(--ok); text-align: center; font-size: 14px; min-height: 20px; margin: 8px 0 0; }
  .build { text-align: center; font-size: 10px; color: var(--muted); opacity: .45; margin: 6px 0 0; font-variant-numeric: tabular-nums; }
  label.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  label.switch input { width: 22px; height: 22px; flex: none; }

  #viewer { background: #000; }
  #viewerImg { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
  .vstrip { display: flex; gap: 6px; overflow-x: auto; padding-top: 10px; flex: none; justify-content: safe center; }
  .vstrip img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; flex: none; opacity: .5; border: 2px solid transparent; }
  .vstrip img.on { opacity: 1; border-color: var(--accent); }
  #complaintText { flex: 1; min-height: 0; width: 100%; resize: none; padding: 12px; border-radius: 14px; margin-bottom: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); line-height: 1.45; }
  #busy { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center;
    font-size: 18px; z-index: 50; text-align: center; padding: 20px; }
</style>
</head>
<body>

<!-- ============ Home ============ -->
<section class="screen" id="scr-home">
  <div class="bar"><h1>ГеоФото</h1><button class="icon" id="toSettings" aria-label="Настройки">⚙︎</button></div>
  <div class="scroll">
    <div class="card">
      <div class="row"><span class="label">Время</span><span class="val" id="liveTime">—</span></div>
      <div class="row"><span class="label">Координаты</span><span class="val" id="liveCoords">Определяю…</span></div>
      <div class="row"><span class="label">Направление</span><span class="val" id="liveDir">—</span></div>
      <div class="row col"><span class="label">Адрес</span><span class="val clamp" id="liveAddr">—</span></div>
    </div>
    <p class="status" id="status"></p>
    <button class="btn ghost" id="geoBtn" hidden>📍 Разрешить геолокацию</button>
    <button class="btn ghost" id="compassBtn" hidden>🧭 Включить компас</button>
  </div>
  <button class="btn ghost" id="resumeBtn" hidden></button>
  <button class="btn" id="newCaseBtn">🚗 Новое нарушение</button>
  <button class="btn gray" id="quickBtn">📷 Просто фото с координатами</button>
  <p class="build" id="build"></p>
</section>

<!-- ============ Step 1: violation type ============ -->
<section class="screen" id="scr-type" hidden>
  <div class="bar"><button class="back" data-back>‹ Назад</button><span class="title">Что нарушено?</span><span class="step">1 из 3</span></div>
  <div class="scroll">
    <div class="opts" id="typeList"></div>
    <div id="otherBox" hidden>
      <input class="field" id="otherText" type="text" placeholder="Опишите нарушение" autocomplete="off" enterkeyhint="next" maxlength="200" style="margin-top:10px">
      <button class="btn" id="otherNext" style="margin-top:10px">Далее</button>
    </div>
  </div>
</section>

<!-- ============ Step 2: photos ============ -->
<section class="screen" id="scr-photos" hidden>
  <div class="bar"><button class="back" data-back>‹ Назад</button><span class="title">Снимки</span><span class="step" id="photosStep">2 из 3</span></div>
  <p class="sub" id="photosSub"></p>
  <div class="scroll">
    <div class="grid" id="grid"></div>
    <p class="empty" id="gridEmpty">Пока нет снимков</p>
  </div>
  <label class="btn" id="shootBtn" for="cam" style="margin-top:12px">📷 Сделать снимок</label>
  <button class="btn gray" id="photosNext" disabled>Далее ›</button>
  <input id="cam" type="file" accept="image/*" capture="environment" hidden>
</section>

<!-- ============ Step 3: plate ============ -->
<section class="screen" id="scr-plate" hidden>
  <div class="bar"><button class="back" data-back>‹ Назад</button><span class="title">Автомобиль</span><span class="step">3 из 3</span></div>
  <div class="scroll">
    <input class="plate-input" id="plate" type="text" placeholder="А123ВС 777" autocomplete="off"
      autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next" maxlength="14">
    <input class="field" id="car" type="text" placeholder="Марка и модель, например Kia Rio" autocomplete="off"
      autocorrect="off" spellcheck="false" enterkeyhint="done" maxlength="60" style="margin-top:10px">
    <div class="sugg" id="carSugg"></div>
    <p class="sub" style="margin-top:8px">Нажмите на снимок, чтобы рассмотреть номер и марку.</p>
    <div class="strip" id="plateStrip"></div>
  </div>
  <button class="btn" id="plateNext">Готово</button>
  <button class="link" id="plateSkip">Номер не виден — пропустить</button>
</section>

<!-- ============ Summary ============ -->
<section class="screen" id="scr-done" hidden>
  <div class="bar"><button class="back" data-back>‹ Назад</button><span class="title">Итог</span><span class="step"></span></div>
  <div class="scroll">
    <div class="card" id="summary"></div>
    <p class="done-ok" id="savedNote"></p>
  </div>
  <button class="btn" id="saveBtn">Сохранить в Фото</button>
  <button class="btn ghost" id="complaintBtn">📝 Текст жалобы</button>
  <div class="btns" style="margin-top:10px">
    <button class="btn gray" id="nextCarBtn">Следующее ТС</button>
    <button class="btn gray" id="homeBtn">На главную</button>
  </div>
</section>

<!-- ============ Settings ============ -->
<section class="screen" id="scr-settings" hidden>
  <div class="bar"><button class="back" data-back>‹ Назад</button><span class="title">Настройки</span><span class="step"></span></div>
  <div class="scroll">
    <label class="switch">Координаты в градусах, минутах, секундах <input type="checkbox" id="optDms"></label>
    <label class="switch">Точность и высота в подписи <input type="checkbox" id="optExtra"></label>
    <label class="switch">Почтовый адрес с индексом и районом <input type="checkbox" id="optFull"></label>
  </div>
</section>

<!-- ============ Photo viewer ============ -->
<section class="screen" id="viewer" hidden>
  <div class="bar"><button class="back" id="viewerClose">‹ Назад</button><span class="title" id="viewerTitle"></span>
    <button class="back" id="viewerDelete" style="color:var(--danger);text-align:right">Удалить</button></div>
  <img id="viewerImg" alt="Снимок с подписью">
  <div class="vstrip" id="viewerStrip"></div>
</section>

<!-- ============ Complaint ============ -->
<section class="screen" id="complaint" hidden>
  <div class="bar"><button class="back" id="complaintClose">‹ Назад</button><span class="title">Текст жалобы</span><span class="step"></span></div>
  <p class="sub">Проверьте текст и скопируйте его в форму обращения (Госуслуги, сайт ГИБДД).</p>
  <textarea id="complaintText" spellcheck="true"></textarea>
  <button class="btn" id="complaintCopy">Скопировать</button>
</section>

<div id="busy" hidden>Обработка…</div>

<script>
const $ = id => document.getElementById(id);

// ---------- app-like behaviour: no page bounce, no pinch or double-tap zoom ----------
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) { e.preventDefault(); return; }
  const sc = e.target.closest('.scroll, .strip, .vstrip, textarea');
  if (!sc || sc.scrollHeight <= sc.clientHeight && sc.scrollWidth <= sc.clientWidth) e.preventDefault();
}, { passive: false });
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 300 && !e.target.closest('input, textarea')) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

// After the camera or the keyboard closes, iOS leaves the view shifted; put it back.
function resetScroll() {
  const el = document.activeElement;
  if (el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' && el.type === 'text')) return;
  const fix = () => { window.scrollTo(0, 0); document.body.scrollTop = 0; };
  fix(); setTimeout(fix, 100); setTimeout(fix, 400);
}
window.addEventListener('focus', resetScroll);
window.addEventListener('pageshow', resetScroll);
document.addEventListener('visibilitychange', () => { if (!document.hidden) resetScroll(); });
if (window.visualViewport) visualViewport.addEventListener('resize', resetScroll);
document.addEventListener('focusout', () => setTimeout(resetScroll, 50));

// ---------- settings ----------
const S = (() => {
  const def = { dms: false, extra: true, full: false };
  try { return Object.assign(def, JSON.parse(localStorage.getItem('geofoto') || '{}')); }
  catch { return def; }
})();
function saveSettings() { try { localStorage.setItem('geofoto', JSON.stringify(S)); } catch {} }
$('optDms').checked = S.dms;
$('optExtra').checked = S.extra;
$('optFull').checked = S.full;
$('optDms').onchange = e => { S.dms = e.target.checked; saveSettings(); renderLive(); };
$('optExtra').onchange = e => { S.extra = e.target.checked; saveSettings(); };
$('optFull').onchange = e => { S.full = e.target.checked; saveSettings(); renderAddr(); };

// ---------- formatting ----------
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
function tzOffset(d) {
  const o = -d.getTimezoneOffset(), a = Math.abs(o);
  return `${o >= 0 ? '+' : '-'}${pad(Math.floor(a / 60))}:${pad(a % 60)}`;
}
function toDms(v, pos, neg) {
  const hemi = v >= 0 ? pos : neg;
  v = Math.abs(v);
  let d = Math.floor(v), m = Math.floor((v - d) * 60), s = Math.round(((v - d) * 60 - m) * 600) / 10;
  if (s >= 60) { s = 0; m++; }
  if (m >= 60) { m = 0; d++; }
  return `${d}°${pad(m)}′${s.toFixed(1).padStart(4, '0')}″${hemi}`;
}
function fmtCoords(lat, lon) {
  return S.dms ? `${toDms(lat, 'N', 'S')} ${toDms(lon, 'E', 'W')}` : `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
}
function fmtExtra(c) {
  const parts = [`Точность: ±${Math.round(c.accuracy)} м`];
  if (c.altitude != null) parts.push(`Высота: ${Math.round(c.altitude)} м`);
  return parts.join('   ');
}
function dist(lat1, lon1, lat2, lon2) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
const plural = (n, one, few, many) => n % 10 === 1 && n % 100 !== 11 ? one
  : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many;
const setStatus = t => { $('status').textContent = t; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- live panel ----------
let fix = null;
function renderLive() {
  const now = new Date();
  $('liveTime').textContent = `${fmtDate(now)} ${fmtTime(now)}`;
  if (fix) {
    const c = fix.coords;
    $('liveCoords').textContent = `${fmtCoords(c.latitude, c.longitude)} ±${Math.round(c.accuracy)} м`;
  }
}
setInterval(renderLive, 1000);
renderLive();

// ---------- compass ----------
const DIRS = ['С', 'СВ', 'В', 'ЮВ', 'Ю', 'ЮЗ', 'З', 'СЗ'];
const fmtHeading = h => `${Math.round(h) % 360}° (${DIRS[Math.round(h / 45) % 8]})`;
let heading = null, headingAt = 0;

function onOrient(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === 'number' && e.webkitCompassHeading >= 0) h = e.webkitCompassHeading; // iOS
  else if (e.absolute && e.alpha != null) h = (360 - e.alpha) % 360;                                         // Android
  if (h == null) return;
  heading = h;
  headingAt = Date.now();
  $('compassBtn').hidden = true;
  $('liveDir').textContent = fmtHeading(h);
}
function startCompass() {
  window.addEventListener('deviceorientationabsolute', onOrient);
  window.addEventListener('deviceorientation', onOrient);
  setTimeout(() => { if (heading == null) $('liveDir').textContent = 'нет данных компаса'; }, 3000);
}
if (!('DeviceOrientationEvent' in window)) {
  $('liveDir').textContent = 'недоступно';
} else if (typeof DeviceOrientationEvent.requestPermission === 'function') {
  // iOS: access to the compass must be requested from a tap
  $('compassBtn').hidden = false;
  $('liveDir').textContent = 'нужно разрешение';
} else {
  startCompass();
}
$('compassBtn').onclick = async () => {
  try {
    if (await DeviceOrientationEvent.requestPermission() === 'granted') startCompass();
    else $('liveDir').textContent = 'доступ запрещён';
  } catch (e) {
    $('liveDir').textContent = 'ошибка: ' + e.message;
  }
};

// ---------- geolocation ----------
let watchId = null, geoAskedAt = 0, geoTries = 0;
const SETTINGS_HINT = 'Включите доступ на iPhone: Настройки → Конфиденциальность и безопасность → Службы геолокации ' +
  '(включены) → Сайты Safari → «При использовании»; и Настройки → Приложения → Safari → Геопозиция → «Спрашивать» или «Разрешить». ' +
  'Затем закройте и откройте приложение заново.';
function geoError(e) {
  if (e.code !== 1) { setStatus('Не удалось определить местоположение: ' + e.message); return; }
  $('geoBtn').hidden = false;
  // A denial that arrives almost instantly means no prompt was shown: the browser/OS blocked it.
  const instant = Date.now() - geoAskedAt < 500;
  if (!geoTries) setStatus('Нет доступа к геолокации. Нажмите кнопку ниже, чтобы разрешить.');
  else setStatus((instant
    ? `Попытка ${geoTries}: браузер заблокировал запрос, не показав окно. `
    : `Попытка ${geoTries}: доступ не разрешён. `) + SETTINGS_HINT);
}
function startGeo() {
  if (!window.isSecureContext) {
    setStatus('Геолокация работает только на сайте с адресом https://. Откройте приложение по ссылке GitHub Pages.');
    return;
  }
  if (!('geolocation' in navigator)) { setStatus('Геолокация недоступна в этом браузере.'); return; }
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  geoAskedAt = Date.now();
  watchId = navigator.geolocation.watchPosition(onFix, geoError, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
$('geoBtn').onclick = () => { geoTries++; setStatus('Запрашиваю доступ…'); startGeo(); };
function onFix(p) {
  fix = p;
  $('geoBtn').hidden = true;
  setStatus('');
  renderLive();
  geocode(p.coords.latitude, p.coords.longitude).catch(() => {});
}
function freshFix() {
  return new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej,
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }));
}
startGeo();

// ---------- reverse geocoding (OpenStreetMap Nominatim, free) ----------
let addr = { text: null, full: null, lat: 0, lon: 0 };
let geoInflight = null, lastGeoAt = 0;
const addrText = () => (S.full ? addr.full : addr.text) || null;

function formatAddress(j) {
  const a = j.address || {};
  const street = [a.road || a.pedestrian || a.footway || a.path || a.square, a.house_number].filter(Boolean).join(', ');
  const place = a.city || a.town || a.village || a.hamlet || a.municipality || a.county;
  const parts = [street || a.suburb || a.neighbourhood, place, a.state, a.country].filter(Boolean);
  return [...new Set(parts)].join(', ') || j.display_name || '';
}

// Postal format used in official complaints: "125009, г. Москва, Тверской район, Театральная площадь, д. 1"
function formatAddressFull(j) {
  const a = j.address || {};
  const place = a.city ? 'г. ' + a.city : a.town || a.village || a.hamlet || a.municipality;
  const district = a.city_district || a.suburb || a.county;
  const road = a.road || a.pedestrian || a.footway || a.path || a.square;
  const parts = [a.postcode, a.city ? null : a.state, place, district, road, a.house_number && 'д. ' + a.house_number];
  return [...new Set(parts.filter(Boolean))].join(', ') || formatAddress(j);
}

function renderAddr() {
  $('liveAddr').textContent = addrText() || '—';
}

function geocode(lat, lon) {
  if (addr.text && dist(lat, lon, addr.lat, addr.lon) < 20) return Promise.resolve(addr.text);
  if (geoInflight) return geoInflight;
  const wait = Math.max(0, lastGeoAt + 1100 - Date.now()); // Nominatim limit: 1 request/sec
  geoInflight = new Promise(r => setTimeout(r, wait)).then(async () => {
    lastGeoAt = Date.now();
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=ru&lat=${lat}&lon=${lon}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    addr = { text: formatAddress(j), full: formatAddressFull(j), lat, lon };
    renderAddr();
    return addr.text;
  }).finally(() => { geoInflight = null; });
  return geoInflight;
}

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

async function addressFor(lat, lon) {
  for (let i = 0; i < 2; i++) {
    try {
      await withTimeout(geocode(lat, lon), 6000);
      if (addr.text && dist(lat, lon, addr.lat, addr.lon) < 50) break;
    } catch { break; }
  }
  const near = addr.text && dist(lat, lon, addr.lat, addr.lon) < 150;
  return near ? { short: addr.text, full: addr.full } : null;
}

// ---------- drawing ----------
function wrap(ctx, text, maxW, maxLines) {
  const words = text.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width <= maxW || !cur) cur = t;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    lines.length = maxLines;
    let last = lines[maxLines - 1];
    while (last && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
    lines[maxLines - 1] = last + '…';
  }
  return lines;
}

// Black info strip under the photo, in the style of traffic-camera fine photos.
const MONO = 'Menlo, "Courier New", monospace';

function stripLayout(w, info) {
  const fs = Math.max(12, Math.round(w * 0.017));
  const padding = Math.round(fs * 0.8);
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = `${fs}px ${MONO}`;
  const maxW = w - padding * 2;
  const lines = [];
  const add = text => lines.push(...wrap(ctx, text, maxW, 3));
  add((info.shot ? `${info.shot}   ` : '') + `Дата: ${info.date}   Время: ${info.time}`);
  if (info.coords) add(`Координаты: ${info.coords}` + (info.extra ? `   ${info.extra}` : ''));
  if (info.heading) add(`Направление съёмки: ${info.heading}`);
  add('Адрес: ' + (info.address || (info.coords ? 'не определён' : 'местоположение не определено')));
  const car = [info.plate && `Госномер: ${info.plate}`, info.car && `ТС: ${info.car}`].filter(Boolean).join('   ');
  if (car) add(car);
  if (info.violation) add(`Нарушение: ${info.violation}`);
  const lineH = Math.round(fs * 1.35);
  return { fs, padding, lineH, lines, height: lines.length * lineH + padding * 2 };
}

function drawStrip(ctx, y0, w, L) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, y0, w, L.height);
  ctx.fillStyle = '#fff';
  ctx.font = `${L.fs}px ${MONO}`;
  ctx.textBaseline = 'top';
  L.lines.forEach((t, i) => ctx.fillText(t, L.padding, y0 + L.padding + i * L.lineH + L.fs * 0.1));
}

async function loadImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    return img;
  } finally {
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
}

// ---------- EXIF (so Photos shows the date and places the photo on the map) ----------
function makeExif(date, coords) {
  const ascii = s => [...s].map(c => c.charCodeAt(0)).concat(0);
  const exifDate = `${date.getFullYear()}:${pad(date.getMonth() + 1)}:${pad(date.getDate())} ${fmtTime(date)}`;
  const size = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8 };
  const byteLen = e => size[e.type] * e.count;
  const E = (tag, type, vals) => ({ tag, type, vals, count: type === 5 ? vals.length / 2 : vals.length });
  const ratDms = v => {
    v = Math.abs(v);
    const d = Math.floor(v), m = Math.floor((v - d) * 60), s = Math.round(((v - d) * 60 - m) * 60 * 10000);
    return [d, 1, m, 1, s, 10000];
  };

  const ifd0 = [E(0x0112, 3, [1]), E(0x0132, 2, ascii(exifDate)), E(0x8769, 4, [0])];
  const exif = [E(0x9003, 2, ascii(exifDate)), E(0x9011, 2, ascii(tzOffset(date)))];
  let gps = null;
  if (coords) {
    ifd0.push(E(0x8825, 4, [0]));
    gps = [
      E(0x0000, 1, [2, 3, 0, 0]),
      E(0x0001, 2, ascii(coords.latitude >= 0 ? 'N' : 'S')),
      E(0x0002, 5, ratDms(coords.latitude)),
      E(0x0003, 2, ascii(coords.longitude >= 0 ? 'E' : 'W')),
      E(0x0004, 5, ratDms(coords.longitude)),
    ];
    if (coords.altitude != null) {
      gps.push(E(0x0005, 1, [coords.altitude < 0 ? 1 : 0]), E(0x0006, 5, [Math.round(Math.abs(coords.altitude) * 100), 100]));
    }
  }
  const ifdSize = es => es.reduce((s, e) => { const n = byteLen(e); return s + (n > 4 ? n + (n & 1) : 0); }, 2 + es.length * 12 + 4);

  const off0 = 8, offExif = off0 + ifdSize(ifd0), offGps = offExif + ifdSize(exif);
  ifd0.find(e => e.tag === 0x8769).vals = [offExif];
  if (gps) ifd0.find(e => e.tag === 0x8825).vals = [offGps];
  const total = offGps + (gps ? ifdSize(gps) : 0);

  const buf = new ArrayBuffer(total), dv = new DataView(buf);
  dv.setUint16(0, 0x4D4D); dv.setUint16(2, 42); dv.setUint32(4, off0);
  const writeIfd = (off, es) => {
    dv.setUint16(off, es.length);
    let data = off + 2 + es.length * 12 + 4;
    es.forEach((e, i) => {
      const p = off + 2 + i * 12, n = byteLen(e);
      dv.setUint16(p, e.tag); dv.setUint16(p + 2, e.type); dv.setUint32(p + 4, e.count);
      let t = p + 8;
      if (n > 4) { dv.setUint32(p + 8, data); t = data; data += n + (n & 1); }
      e.vals.forEach((v, k) => {
        if (e.type <= 2) dv.setUint8(t + k, v);
        else if (e.type === 3) dv.setUint16(t + k * 2, v);
        else dv.setUint32(t + k * 4, v);
      });
    });
    dv.setUint32(off + 2 + es.length * 12, 0);
  };
  writeIfd(off0, ifd0);
  writeIfd(offExif, exif);
  if (gps) writeIfd(offGps, gps);

  const segLen = 2 + 6 + total;
  const head = new Uint8Array([0xFF, 0xE1, segLen >> 8, segLen & 0xFF, 0x45, 0x78, 0x69, 0x66, 0, 0]);
  return [head, new Uint8Array(buf)];
}

async function withExif(jpegBlob, date, coords) {
  const b = new Uint8Array(await jpegBlob.arrayBuffer());
  let rest = b.subarray(2);
  if (b[2] === 0xFF && b[3] === 0xE0) rest = b.subarray(4 + ((b[4] << 8) | b[5])); // drop JFIF APP0
  return new Blob([new Uint8Array([0xFF, 0xD8]), ...makeExif(date, coords), rest], { type: 'image/jpeg' });
}

// Russian plates use only letters that look Latin, so Latin input is converted to Cyrillic.
const LAT2CYR = { A: 'А', B: 'В', E: 'Е', K: 'К', M: 'М', H: 'Н', O: 'О', P: 'Р', C: 'С', T: 'Т', Y: 'У', X: 'Х' };
const upPlate = v => v.toUpperCase().replace(/[ABEKMHOPCTYX]/g, ch => LAT2CYR[ch]);
function formatPlate(v) {
  v = upPlate(v).trim();
  const m = v.replace(/\s+/g, '').match(/^([АВЕКМНОРСТУХ]\d{3}[АВЕКМНОРСТУХ]{2})(\d{2,3})$/);
  return m ? `${m[1]} ${m[2]}` : v;
}

async function collectShot(file) {
  const now = Date.now();
  const when = new Date(file.lastModified && now - file.lastModified < 600000 ? Math.min(now, file.lastModified) : now);
  let p = fix;
  if ('geolocation' in navigator && (!p || now - p.timestamp > 60000)) p = await freshFix().catch(() => fix);
  const c = p && p.coords;
  const a = c ? await addressFor(c.latitude, c.longitude) : null;
  return { file, thumb: URL.createObjectURL(file), when, coords: c, addr: a, heading: shotHeading, rendered: null };
}

$('cam').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  resetScroll();
  if (!file) return;
  $('busy').hidden = false;
  try {
    C.shots.push(await collectShot(file));
    C.saved = false;
    renderPhotos();
  } catch (err) {
    alert('Ошибка обработки фото: ' + err.message);
  } finally {
    $('busy').hidden = true;
  }
});

// Photos are numbered "1 из N" only when rendered for saving, once N is known.
async function renderShot(s, i, n) {
  const shotAddr = s.addr ? (S.full ? s.addr.full : s.addr.short) : null;
  const key = [i, n, C.plate, C.car, violationText(), S.dms, S.extra, S.full].join('|');
  if (s.rendered && s.rendered.key === key) return s.rendered;
  const img = await loadImage(s.file);
  let w = img.naturalWidth, h = img.naturalHeight;
  const k = Math.min(1, Math.sqrt(15000000 / (w * h))); // iOS canvas size limit, with room for the strip
  w = Math.round(w * k); h = Math.round(h * k);
  const c = s.coords, when = s.when;
  const strip = stripLayout(w, {
    shot: n > 1 ? `Снимок ${i} из ${n}` : null,
    date: fmtDate(when),
    time: `${fmtTime(when)} (UTC${tzOffset(when)})`,
    coords: c ? fmtCoords(c.latitude, c.longitude) : null,
    extra: c && S.extra ? fmtExtra(c) : null,
    heading: s.heading != null ? fmtHeading(s.heading) : null,
    address: shotAddr,
    plate: C.plate,
    car: C.car,
    violation: violationText(),
  });
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h + strip.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  drawStrip(ctx, h, w, strip);
  const jpeg = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
  canvas.width = canvas.height = 0;
  const stamp = `${when.getFullYear()}${pad(when.getMonth() + 1)}${pad(when.getDate())}_${fmtTime(when).replace(/:/g, '')}`;
  if (s.rendered) URL.revokeObjectURL(s.rendered.url);
  const blob = await withExif(jpeg, when, c);
  s.rendered = { key, blob, url: URL.createObjectURL(blob), name: `GeoFoto_${stamp}${n > 1 ? `_${i}из${n}` : ''}.jpg` };
  return s.rendered;
}

let viewing = -1;
function renderViewerStrip() {
  $('viewerStrip').innerHTML = '';
  $('viewerStrip').hidden = C.shots.length < 2;
  C.shots.forEach((s, i) => {
    const img = document.createElement('img');
    img.src = s.thumb;

  if (cur) cur.scrollIntoView({ inline: 'center', block: 'nearest' });
}
async function openViewer(i) {
  viewing = i;
  $('viewerTitle').textContent = `Снимок ${i + 1} из ${C.shots.length}`;
  $('viewer').hidden = false;
  renderViewerStrip();
  $('viewerImg').src = C.shots[i].thumb; // show the raw photo at once, then the version with the strip
  try {
    const r = await renderShot(C.shots[i], i + 1, C.shots.length);
    if (viewing === i) $('viewerImg').src = r.url;
  } catch (err) {
    alert('Ошибка обработки фото: ' + err.message);
  }
}

$('viewerDelete').onclick = () => {
  if (!confirm(`Удалить снимок ${viewing + 1}?`)) return;
  const [s] = C.shots.splice(viewing, 1);
  URL.revokeObjectURL(s.thumb);
  if (s.rendered) URL.revokeObjectURL(s.rendered.url);
  C.saved = false;
  if (C.shots.length) { openViewer(Math.min(viewing, C.shots.length - 1)); return; }
  $('viewer').hidden = true;
  go('photos');
};
// Swipe left/right on the photo to move through the series.
{
  let x0 = null;
  $('viewerImg').addEventListener('touchstart', e => { x0 = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });

    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0;

    if (Math.abs(dx) < 50) return;
    const next = viewing + (dx < 0 ? 1 : -1);
    if (next >= 0 && next < C.shots.length) openViewer(next);
  });
}

  ['Dongfeng', 'донгфенг дунфэн', 'Shine Max,580,Aeolus'],
  ['JAC', 'джак', 'JS4,J7,T8'],
  ['Great Wall', 'грейт волл', 'Wingle 7,Poer'],
  ['ГАЗ', 'газ gaz газель', 'Газель,Газель Next,Соболь,Валдай'],
  ['УАЗ', 'уаз uaz', 'Патриот,Хантер,Буханка,Профи'],
  ['Ford', 'форд', 'Focus,Mondeo,Kuga,EcoSport,Explorer,Transit,Fiesta'],
  ['Chevrolet', 'шевроле шевролет шеви', 'Niva,Cruze,Aveo,Lacetti,Cobalt,Captiva,Tahoe,Spark'],
  ['Daewoo', 'дэу деу', 'Nexia,Matiz,Gentra'],
  ['Datsun', 'датсун', 'on-DO,mi-DO'],
  ['Lexus', 'лексус', 'RX,NX,ES,LX,GX,IS,UX'],
  ['Honda', 'хонда', 'CR-V,Civic,Accord,Pilot,Fit'],
  ['Subaru', 'субару', 'Forester,Outback,XV,Impreza,Legacy'],
  ['Volvo', 'вольво', 'XC40,XC60,XC90,S60,S90'],
  ['Land Rover', 'ленд ровер лэнд ровер рендж', 'Range Rover,Range Rover Sport,Range Rover Evoque,Discovery,Defender'],
  ['Porsche', 'порше', 'Cayenne,Macan,Panamera,911'],
  ['Peugeot', 'пежо', '308,408,3008,5008,Partner'],
  ['Citroen', 'ситроен', 'C3,C4,C5 Aircross,Berlingo'],
  ['Opel', 'опель', 'Astra,Corsa,Zafira,Insignia,Mokka'],
  ['Suzuki', 'сузуки', 'Vitara,SX4,Jimny,Swift'],
  ['Infiniti', 'инфинити', 'QX50,QX60,QX80,FX35'],
  ['Jeep', 'джип', 'Grand Cherokee,Wrangler,Compass'],
  ['Tesla', 'тесла', 'Model 3,Model Y,Model S,Model X'],
];
const norm = s => s.toLowerCase().replace(/ё/g, 'е').replace(/[-‐]/g, ' ').replace(/\s+/g, ' ').trim();
// Rough phonetic key so that "тойота кам" finds Toyota Camry and "лада ве" finds Lada Vesta.
const RU2LAT = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ж: 'zh', з: 'z', и: 'i', й: 'i', к: 'k', л: 'l', м: 'm', н: 'n',
  о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'ts', ч: 'ch', ш: 'sh', щ: 'sh', ъ: '', ы: 'i', ь: '', э: 'e', ю: 'u', я: 'a' };
// Cyrillic "х" is "h" in names (Хавал) but "x" in models typed on a Russian keyboard (Х5), so the query tries both.
const canon = (s, hx = 'h') => norm(s)
  .replace(/дж/g, 'j').replace(/х/g, hx).replace(/[а-я]/g, ch => RU2LAT[ch] ?? ch)
  .replace(/ph/g, 'f').replace(/ck/g, 'k').replace(/c(?!h)/g, 'k').replace(/q/g, 'k').replace(/w/g, 'v')
  .replace(/y/g, 'i').replace(/([a-z])\1+/g, '$1');
const CAR_INDEX = [];
for (const [make, ru, models] of CARS) {
  const makeKeys = [...new Set([make, ...ru.split(' ')].map(s => canon(s)))];
  CAR_INDEX.push({ text: make, make: true, keys: makeKeys, modelKeys: [], order: CAR_INDEX.length });
  for (const m of models.split(',')) {
    const cm = canon(m);
    CAR_INDEX.push({ text: `${make} ${m}`, keys: makeKeys.map(k => `${k} ${cm}`), modelKeys: [cm], order: CAR_INDEX.length });
  }
}
const recentCars = () => { try { return JSON.parse(localStorage.getItem('geofoto-cars') || '[]'); } catch { return []; } };
function rememberCar(v) {
  if (!v) return;
  const list = [v, ...recentCars().filter(x => x !== v)].slice(0, 10);
  try { localStorage.setItem('geofoto-cars', JSON.stringify(list)); } catch {}
}

function matchScore(key, qv) {
  let best = null;
  for (const q of qv) {
    const qs = q.replace(/ /g, '');
    const k = key.replace(/ /g, '');
    const s = k === qs ? -0.3 : key.startsWith(q) ? 0 : k.startsWith(qs) ? 0.5 : key.includes(' ' + q) ? 1 : null;
    if (s != null && (best == null || s < best)) best = s;
  }
  return best;
}

function carSuggestions(raw) {
  const qv = [...new Set([canon(raw), canon(raw, 'x')])];
  const recent = recentCars();
  if (!qv[0]) return recent.slice(0, 6).map(text => ({ text, recent: true }));
  const scored = [];
  for (const text of recent) {
    if (matchScore(canon(text), qv) != null) scored.push({ text, recent: true, score: -1 });
  }
  for (const e of CAR_INDEX) {
    let best = null;
    const consider = (s, bonus) => { if (s != null && (best == null || s + bonus < best)) best = s + bonus; };
    for (const k of e.modelKeys) consider(matchScore(k, qv), 1.2); // "rio", "газель", "cx5"
    for (const k of e.keys) consider(matchScore(k, qv), e.make ? 0 : 1.5); // "kia", "kia r"
    if (best != null && !scored.some(s => s.text === e.text)) scored.push({ text: e.text, make: e.make, score: best, order: e.order });
  }
  // once a make is typed exactly, show its models rather than the make itself
  const exactMake = CAR_INDEX.find(e => e.make && qv.some(q => e.keys.includes(q)));
  return scored
    .filter(s => !(exactMake && s.make && s.text === exactMake.text))
    .sort((a, b) => a.score - b.score || (a.order ?? -1) - (b.order ?? -1))
    .slice(0, 8);
}

function renderSugg() {
  const box = $('carSugg');
  box.innerHTML = '';
  if (document.activeElement !== $('car')) return;
  for (const s of carSuggestions($('car').value)) {
    const b = document.createElement('button');
    if (s.recent) b.className = 'recent';
    const sp = s.text.indexOf(' ');
    b.innerHTML = sp > 0 && !s.make ? `<b>${esc(s.text.slice(0, sp))}</b>${esc(s.text.slice(sp))}` : `<b>${esc(s.text)}</b>`;
    // mousedown/touch keeps focus in the input, so the keyboard stays open
    b.addEventListener('pointerdown', e => e.preventDefault());
    b.onclick = () => {
      $('car').value = s.make ? s.text + ' ' : s.text;
      if (s.make) { $('car').focus(); renderSugg(); } else { $('car').blur(); box.innerHTML = ''; }
    };
    box.appendChild(b);
  }
}
$('car').addEventListener('input', renderSugg);
$('car').addEventListener('focus', renderSugg);
$('car').addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== $('car')) $('carSugg').innerHTML = ''; }, 150));
$('car').onkeydown = e => { if (e.key === 'Enter') $('plateNext').click(); };

function renderPlate() {
  $('plate').value = C.plate;
  $('car').value = C.car || '';
  $('carSugg').innerHTML = '';
  $('plateStrip').innerHTML = '';
  C.shots.forEach((s, i) => {
    const img = document.createElement('img');
    img.src = s.thumb;
    img.onclick = () => openViewer(i);
    $('plateStrip').appendChild(img);
  });
}
$('plate').addEventListener('input', () => {
  const el = $('plate'), pos = el.selectionStart, up = upPlate(el.value);
  if (up !== el.value) { el.value = up; el.setSelectionRange(pos, pos); }
});
$('plate').addEventListener('blur', () => { $('plate').value = formatPlate($('plate').value); });
$('plate').onkeydown = e => { if (e.key === 'Enter') $('car').focus(); };
const saveCar = () => {
  C.car = $('car').value.trim().replace(/\s+/g, ' ');
  rememberCar(C.car);
  document.activeElement.blur();
};
$('plateNext').onclick = () => { C.plate = formatPlate($('plate').value); saveCar(); go('done'); };
$('plateSkip').onclick = () => { C.plate = ''; saveCar(); go('done'); };

// ---------- summary ----------
function renderDone() {
  const n = C.shots.length, s = C.shots[0];
  const place = s && s.addr ? (S.full ? s.addr.full : s.addr.short) : s && s.coords ? fmtCoords(s.coords.latitude, s.coords.longitude) : '—';
  const rows = [];
  if (!C.quick) {
    rows.push(['Нарушение', violationText()]);
    rows.push(['Госномер', C.plate || 'не указан']);
    rows.push(['Марка и модель', C.car || 'не указаны']);
  }
  if (s) rows.push(['Время', `${fmtDate(s.when)} ${fmtTime(s.when).slice(0, 5)}`]);
  rows.push(['Адрес', place]);
  rows.push(['Снимков', String(n)]);
  $('summary').innerHTML = rows.map(([k, v]) =>
    `<div class="row${k === 'Адрес' || k === 'Нарушение' ? ' col' : ''}"><span class="label">${k}</span><span class="val">${esc(v)}</span></div>`).join('');
  $('saveBtn').textContent = n > 1 ? `Сохранить в Фото (${n})` : 'Сохранить в Фото';
  $('savedNote').textContent = C.saved ? 'Сохранено ✓' : n > 1 ? `Снимки получат номера «1 из ${n}» … «${n} из ${n}».` : '';
  $('complaintBtn').hidden = C.quick;
  $('nextCarBtn').textContent = C.quick ? 'Новые фото' : 'Следующее ТС';
}

$('saveBtn').onclick = async () => {
  const n = C.shots.length;
  const files = [];
  $('busy').hidden = false;
  try {
    for (let i = 0; i < n; i++) {
      $('busy').textContent = n > 1 ? `Подготовка снимка ${i + 1} из ${n}…` : 'Подготовка…';
      const r = await renderShot(C.shots[i], i + 1, n);
      files.push(new File([r.blob], r.name, { type: 'image/jpeg' }));
    }
  } catch (err) {
    alert('Ошибка обработки фото: ' + err.message);
    return;
  } finally {
    $('busy').hidden = true;
    $('busy').textContent = 'Обработка…';
  }
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); C.saved = true; }
    catch (e) { if (e.name !== 'AbortError') alert(e.message); }
  } else {
    for (const f of files) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f); a.download = f.name; a.click();
    }
    C.saved = true;
  }
  renderDone();
};

// Same violation and place, new vehicle: keep the violation, clear photos and plate.
$('nextCarBtn').onclick = () => {
  if (!confirmDiscard()) return;
  C = Object.assign(newCase(C.quick, C.violation), { other: C.other });
  go('photos');
};
$('homeBtn').onclick = () => {
  if (!confirmDiscard()) return;
  C = null;
  go('home');
};

// ---------- complaint text ----------
function buildComplaint() {
  const s = C.shots[0], d = s.when;
  const coords = s.coords ? `${s.coords.latitude.toFixed(6)}, ${s.coords.longitude.toFixed(6)}` : null;
  const place = s.addr
    ? `по адресу: ${s.addr.full || s.addr.short}` + (coords ? ` (координаты ${coords})` : '')
    : coords ? `в точке с координатами ${coords}` : 'по адресу: [укажите адрес]';
  const car = `транспортное средство${C.car ? ' ' + C.car : ''} с государственным регистрационным знаком ${C.plate || '[госномер]'}`;
  const what = C.violation ? `${car} ${C.violation.act}.` : `${car}: ${C.other || '[опишите нарушение]'}.`;
  const n = C.shots.length;
  return `${fmtDate(d)} в ${pad(d.getHours())}:${pad(d.getMinutes())} ${place} ${what}\n\n` +
    'Прошу провести проверку по данному факту и привлечь водителя (собственника) транспортного средства ' +
    'к административной ответственности.\n\n' +
    `Фотоматериалы с указанием даты, времени и координат места съёмки прилагаются (${n} ${plural(n, 'снимок', 'снимка', 'снимков')}).`;
}
$('complaintBtn').onclick = () => {
  $('complaintText').value = buildComplaint();
  $('complaintCopy').textContent = 'Скопировать';
  $('complaint').hidden = false;
};
$('complaintClose').onclick = () => { $('complaintText').blur(); $('complaint').hidden = true; };
$('complaintCopy').onclick = async () => {
  const t = $('complaintText');
  try {
    await navigator.clipboard.writeText(t.value);
  } catch {
    t.select();
    document.execCommand('copy');
  }
  t.blur();
  $('complaintCopy').textContent = 'Скопировано ✓';
};

// ---------- build stamp (filled in by the GitHub Actions deploy) ----------
const BUILD = { sha: '__BUILD_SHA__', date: '__BUILD_DATE__' };
if (BUILD.sha.indexOf('__') === 0) {
  $('build').textContent = 'локальная версия';
} else {
  const d = new Date(BUILD.date);
  $('build').textContent = `обновлено ${fmtDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())} · ${BUILD.sha}`;
}

go('home');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
