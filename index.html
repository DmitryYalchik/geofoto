<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ГеоФото">
<meta name="theme-color" content="#0b0f14">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>ГеоФото</title>
<style>
  :root {
    --bg: #0b0f14; --card: #151b23; --line: #232c37; --text: #e8edf2;
    --muted: #8a97a6; --accent: #2f8cff; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  body { min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 12px) 16px
    calc(env(safe-area-inset-bottom) + 16px); display: flex; flex-direction: column; }
  h1 { font-size: 22px; margin: 4px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row[hidden] { display: none; }
  .row .label { color: var(--muted); flex: none; }
  .row .val { text-align: right; font-variant-numeric: tabular-nums; word-break: break-word; }
  .row.addr { flex-direction: column; gap: 4px; }
  .row.addr .val { text-align: left; }
  .status { color: var(--danger); min-height: 1.4em; margin: 10px 2px; font-size: 14px; }
  .geo-btn { width: 100%; padding: 13px; margin-bottom: 8px; border-radius: 14px; border: 1px solid var(--accent);
    background: transparent; color: var(--accent); font-size: 16px; font-weight: 600; }
  .geo-btn[hidden] { display: none; }
  details { margin-top: 4px; color: var(--muted); font-size: 15px; }
  details label { display: flex; align-items: center; gap: 10px; padding: 8px 0; color: var(--text); }
  details input { width: 20px; height: 20px; }
  .spacer { flex: 1; min-height: 16px; }
  .comment { position: relative; margin-bottom: 10px; }
  .comment input { width: 100%; padding: 14px 44px 14px 14px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 16px; }
  .comment input:focus { outline: none; border-color: var(--accent); }
  .comment button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px;
    border: 0; border-radius: 50%; background: #2a323d; color: var(--muted); font-size: 14px; }
  .comment button[hidden] { display: none; }
  .comment input.plate { font-weight: 600; letter-spacing: .5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 14px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #complaint[hidden] { display: none; }
  .series-done { color: var(--muted); text-align: center; font-size: 13px; margin: 8px 0 0; }
  .result-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; color: var(--text); font-size: 15px; }
  .result-top button { border: 0; background: none; color: var(--accent); font-size: 15px; padding: 6px 0; }
  #deleteBtn { color: var(--danger); }
  .build { text-align: center; font-size: 10px; color: var(--muted); opacity: .45; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
  .secondary { width: 100%; margin-top: 10px; padding: 13px; border-radius: 14px; border: 1px solid var(--accent);
    background: transparent; color: var(--accent); font-size: 16px; font-weight: 600; }
  #complaint { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 10;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px); }
  #complaint h2 { margin: 4px 0 6px; font-size: 20px; }
  .hint.left { text-align: left; margin: 0 0 10px; }
  #complaintText { flex: 1; min-height: 0; width: 100%; resize: none; padding: 12px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); font: 16px/1.45 system-ui, -apple-system, sans-serif; }
  #complaintCopy { background: var(--accent); color: #fff; }
  #complaintClose { background: #2a323d; color: var(--text); }
  .shoot { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    padding: 18px; border-radius: 18px; background: var(--accent); color: #fff; font-size: 19px;
    font-weight: 600; border: 0; cursor: pointer; }
  .shoot:active { opacity: .8; }
  #result { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 12px); }
  #result[hidden], #busy[hidden] { display: none; }
  #preview { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
  .actions { display: flex; gap: 10px; margin-top: 10px; }
  .actions button { flex: 1; padding: 15px; border-radius: 14px; border: 0; font-size: 17px; font-weight: 600; }
  #saveBtn { background: var(--accent); color: #fff; }
  #againBtn { background: #2a323d; color: var(--text); }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: 8px 0 0; }
  #busy { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center;
    justify-content: center; font-size: 18px; }
</style>
</head>
<body>
  <h1>ГеоФото</h1>

  <section class="card">
    <div class="row"><span class="label">Дата и время</span><span class="val" id="liveTime">—</span></div>
    <div class="row"><span class="label">Координаты</span><span class="val" id="liveCoords">Определяю…</span></div>
    <div class="row"><span class="label">Точность</span><span class="val" id="liveAcc">—</span></div>
    <div class="row"><span class="label">Направление</span><span class="val" id="liveDir">—</span></div>
    <div class="row addr"><span class="label">Адрес</span><span class="val" id="liveAddr">—</span></div>
  </section>
  <p class="status" id="status"></p>
  <button class="geo-btn" id="geoBtn" hidden>📍 Разрешить геолокацию</button>
  <button class="geo-btn" id="compassBtn" hidden>🧭 Включить компас</button>

  <details>
    <summary>Настройки</summary>
    <label><input type="checkbox" id="optDms"> Координаты в градусах/минутах/секундах</label>
    <label><input type="checkbox" id="optExtra"> Показывать точность и высоту в подписи</label>
    <label><input type="checkbox" id="optFull"> Почтовый адрес с индексом и районом</label>
  </details>

  <div class="spacer"></div>
  <div class="comment">
    <input id="plate" class="plate" type="text" placeholder="Госномер, например А123ВС 777" autocomplete="off"
      autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done" maxlength="14">
    <button id="plateClear" aria-label="Очистить госномер" hidden>✕</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="comment">
    <input id="comment" type="text" placeholder="Нарушение или комментарий" autocomplete="off" enterkeyhint="done" maxlength="200">
    <button id="commentClear" aria-label="Очистить комментарий" hidden>✕</button>
  </div>
  <label class="shoot" id="shootBtn" for="cam">📷 Сфотографировать</label>
  <p class="build" id="build"></p>
  <input id="cam" type="file" accept="image/*" capture="environment" hidden>

  <section id="result" hidden>
    <div class="result-top">
      <button id="closeBtn">✕ Закрыть</button>
      <span id="seriesCount"></span>
      <button id="deleteBtn">Удалить снимок</button>
    </div>
    <img id="preview" alt="Фото с отметкой">
    <p class="series-done" id="seriesHint"></p>
    <button class="secondary" id="complaintBtn">📝 Текст жалобы</button>
    <div class="actions">
      <button id="againBtn">Ещё фото</button>
      <button id="saveBtn">Сохранить</button>
    </div>
  </section>

  <section id="complaint" hidden>
    <h2>Текст жалобы</h2>
    <p class="hint left">Проверьте и при необходимости исправьте текст, затем скопируйте его в форму обращения (Госуслуги, сайт ГИБДД).</p>
    <textarea id="complaintText" spellcheck="true"></textarea>
    <div class="actions">
      <button id="complaintClose">Закрыть</button>
      <button id="complaintCopy">Скопировать</button>
    </div>
  </section>

  <div id="busy" hidden>Обработка…</div>

<script>
const $ = id => document.getElementById(id);

// ---------- settings ----------
const S = (() => {
  const def = { dms: false, extra: true, full: false };
  try { return Object.assign(def, JSON.parse(localStorage.getItem('geofoto') || '{}')); }
  catch { return def; }
})();
function saveSettings() { try { localStorage.setItem('geofoto', JSON.stringify(S)); } catch {} }
$('optDms').checked = S.dms;
$('optExtra').checked = S.extra;
$('optDms').onchange = e => { S.dms = e.target.checked; saveSettings(); renderLive(); };
$('optExtra').onchange = e => { S.extra = e.target.checked; saveSettings(); };
$('optFull').checked = S.full;
$('optFull').onchange = e => { S.full = e.target.checked; saveSettings(); renderAddr(); };

// ---------- formatting ----------
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
function tzOffset(d) {
  const o = -d.getTimezoneOffset(), a = Math.abs(o);
  return `${o >= 0 ? '+' : '-'}${pad(Math.floor(a / 60))}:${pad(a % 60)}`;
}
function toDms(v, pos, neg) {
  const hemi = v >= 0 ? pos : neg;
  v = Math.abs(v);
  let d = Math.floor(v), m = Math.floor((v - d) * 60), s = Math.round(((v - d) * 60 - m) * 600) / 10;
  if (s >= 60) { s = 0; m++; }
  if (m >= 60) { m = 0; d++; }
  return `${d}°${pad(m)}′${s.toFixed(1).padStart(4, '0')}″${hemi}`;
}
function fmtCoords(lat, lon) {
  return S.dms ? `${toDms(lat, 'N', 'S')} ${toDms(lon, 'E', 'W')}` : `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
}
function fmtExtra(c) {
  const parts = [`Точность: ±${Math.round(c.accuracy)} м`];
  if (c.altitude != null) parts.push(`Высота: ${Math.round(c.altitude)} м`);
  return parts.join('   ');
}
function dist(lat1, lon1, lat2, lon2) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
const setStatus = t => { $('status').textContent = t; };

// ---------- live panel ----------
let fix = null;
function renderLive() {
  const now = new Date();
  $('liveTime').textContent = `${fmtDate(now)} ${fmtTime(now)}`;
  if (fix) {
    const c = fix.coords;
    $('liveCoords').textContent = fmtCoords(c.latitude, c.longitude);
    $('liveAcc').textContent = `±${Math.round(c.accuracy)} м`;
  }
}
setInterval(renderLive, 1000);
renderLive();

// ---------- iOS viewport fix ----------
// After the camera or the keyboard closes, iOS home-screen apps are left scrolled up a little.
function resetScroll() {
  const el = document.activeElement;
  if (el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type === 'text'))) return;
  window.scrollTo(0, 0);
  setTimeout(() => window.scrollTo(0, 0), 100);
  setTimeout(() => window.scrollTo(0, 0), 400);
}
window.addEventListener('focus', resetScroll);
window.addEventListener('pageshow', resetScroll);
document.addEventListener('visibilitychange', () => { if (!document.hidden) resetScroll(); });
if (window.visualViewport) visualViewport.addEventListener('resize', resetScroll);

// ---------- compass ----------
const DIRS = ['С', 'СВ', 'В', 'ЮВ', 'Ю', 'ЮЗ', 'З', 'СЗ'];
const fmtHeading = h => `${Math.round(h) % 360}° (${DIRS[Math.round(h / 45) % 8]})`;
let heading = null, headingAt = 0;

function onOrient(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === 'number' && e.webkitCompassHeading >= 0) h = e.webkitCompassHeading; // iOS
  else if (e.absolute && e.alpha != null) h = (360 - e.alpha) % 360;                                         // Android
  if (h == null) return;
  heading = h;
  headingAt = Date.now();
  $('compassBtn').hidden = true;
  $('liveDir').textContent = fmtHeading(h);
}
function startCompass() {
  window.addEventListener('deviceorientationabsolute', onOrient);
  window.addEventListener('deviceorientation', onOrient);
  setTimeout(() => { if (heading == null) $('liveDir').textContent = 'нет данных компаса'; }, 3000);
}
if (!('DeviceOrientationEvent' in window)) {
  $('liveDir').textContent = 'недоступно';
} else if (typeof DeviceOrientationEvent.requestPermission === 'function') {
  // iOS: access to the compass must be requested from a tap
  $('compassBtn').hidden = false;
  $('liveDir').textContent = 'нужно разрешение';
} else {
  startCompass();
}
$('compassBtn').onclick = async () => {
  try {
    if (await DeviceOrientationEvent.requestPermission() === 'granted') startCompass();
    else $('liveDir').textContent = 'доступ запрещён';
  } catch (e) {
    $('liveDir').textContent = 'ошибка: ' + e.message;
  }
};

// ---------- violation: plate, quick buttons, comment ----------
const VIOLATIONS = [
  { label: 'Парковка на тротуаре', act: 'припарковано на тротуаре' },
  { label: 'На газоне', act: 'размещено на газоне (озеленённой территории)' },
  { label: 'Под знаком «Остановка запрещена»', act: 'остановлено в зоне действия знака 3.27 «Остановка запрещена»' },
  { label: 'На пешеходном переходе', act: 'остановлено на пешеходном переходе' },
];
const findViolation = text => VIOLATIONS.find(v => v.label === text.trim());

// Russian plates use only letters that look Latin, so Latin input is converted to Cyrillic.
const LAT2CYR = { A: 'А', B: 'В', E: 'Е', K: 'К', M: 'М', H: 'Н', O: 'О', P: 'Р', C: 'С', T: 'Т', Y: 'У', X: 'Х' };
const upPlate = v => v.toUpperCase().replace(/[ABEKMHOPCTYX]/g, ch => LAT2CYR[ch]);
function formatPlate(v) {
  v = upPlate(v).trim();
  const m = v.replace(/\s+/g, '').match(/^([АВЕКМНОРСТУХ]\d{3}[АВЕКМНОРСТУХ]{2})(\d{2,3})$/);
  return m ? `${m[1]} ${m[2]}` : v;
}

function bindField(id, key) {
  const input = $(id), clear = $(id + 'Clear');
  try { input.value = localStorage.getItem(key) || ''; } catch {}
  const sync = () => {
    clear.hidden = !input.value;
    try { localStorage.setItem(key, input.value); } catch {}
    renderChips();
  };
  input.addEventListener('input', sync);
  input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
  input.addEventListener('blur', () => setTimeout(resetScroll, 50));
  clear.onclick = () => { input.value = ''; sync(); input.focus(); };
  return sync;
}

function renderChips() {
  const cur = $('comment').value.trim();
  for (const b of $('chips').children) b.classList.toggle('on', b.textContent === cur);
}
for (const v of VIOLATIONS) {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = v.label;
  b.onclick = () => { $('comment').value = $('comment').value.trim() === v.label ? '' : v.label; syncComment(); };
  $('chips').appendChild(b);
}

const syncComment = bindField('comment', 'geofoto-comment');
const syncPlate = bindField('plate', 'geofoto-plate');
$('plate').addEventListener('input', () => {
  const el = $('plate'), pos = el.selectionStart, up = upPlate(el.value);
  if (up !== el.value) { el.value = up; el.setSelectionRange(pos, pos); syncPlate(); }
});
$('plate').addEventListener('blur', () => { $('plate').value = formatPlate($('plate').value); syncPlate(); });
syncComment();
syncPlate();

// ---------- geolocation ----------
let watchId = null, geoAskedAt = 0, geoTries = 0;
const SETTINGS_HINT = 'Включите доступ на iPhone: Настройки → Конфиденциальность и безопасность → Службы геолокации ' +
  '(включены) → Сайты Safari → «При использовании»; и Настройки → Приложения → Safari → Геопозиция → «Спрашивать» или «Разрешить». ' +
  'Затем закройте и откройте приложение заново.';
function geoError(e) {
  if (e.code !== 1) { setStatus('Не удалось определить местоположение: ' + e.message); return; }
  $('geoBtn').hidden = false;
  // A denial that arrives almost instantly means no prompt was shown: the browser/OS blocked it.
  const instant = Date.now() - geoAskedAt < 500;
  if (!geoTries) setStatus('Нет доступа к геолокации. Нажмите кнопку ниже, чтобы разрешить.');
  else setStatus((instant
    ? `Попытка ${geoTries}: браузер заблокировал запрос, не показав окно. `
    : `Попытка ${geoTries}: доступ не разрешён. `) + SETTINGS_HINT);
}
function startGeo() {
  if (!window.isSecureContext) {
    setStatus('Геолокация работает только на сайте с адресом https://. Откройте приложение по ссылке GitHub Pages.');
    return;
  }
  if (!('geolocation' in navigator)) { setStatus('Геолокация недоступна в этом браузере.'); return; }
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  geoAskedAt = Date.now();
  watchId = navigator.geolocation.watchPosition(onFix, geoError, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
$('geoBtn').onclick = () => { geoTries++; setStatus('Запрашиваю доступ…'); startGeo(); };
function onFix(p) {
  fix = p;
  $('geoBtn').hidden = true;
  setStatus('');
  renderLive();
  geocode(p.coords.latitude, p.coords.longitude).catch(() => {});
}
function freshFix() {
  return new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej,
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }));
}
startGeo();

// ---------- reverse geocoding (OpenStreetMap Nominatim, free) ----------
let addr = { text: null, full: null, lat: 0, lon: 0 };
let geoInflight = null, lastGeoAt = 0;
const addrText = () => (S.full ? addr.full : addr.text) || null;

function formatAddress(j) {
  const a = j.address || {};
  const street = [a.road || a.pedestrian || a.footway || a.path || a.square, a.house_number].filter(Boolean).join(', ');
  const place = a.city || a.town || a.village || a.hamlet || a.municipality || a.county;
  const parts = [street || a.suburb || a.neighbourhood, place, a.state, a.country].filter(Boolean);
  return [...new Set(parts)].join(', ') || j.display_name || '';
}

// Postal format used in official complaints: "125009, г. Москва, Тверской район, Театральная площадь, д. 1"
function formatAddressFull(j) {
  const a = j.address || {};
  const place = a.city ? 'г. ' + a.city : a.town || a.village || a.hamlet || a.municipality;
  const district = a.city_district || a.suburb || a.county;
  const road = a.road || a.pedestrian || a.footway || a.path || a.square;
  const parts = [a.postcode, a.city ? null : a.state, place, district, road, a.house_number && 'д. ' + a.house_number];
  return [...new Set(parts.filter(Boolean))].join(', ') || formatAddress(j);
}

function renderAddr() {
  $('liveAddr').textContent = addrText() || '—';
}

function geocode(lat, lon) {
  if (addr.text && dist(lat, lon, addr.lat, addr.lon) < 20) return Promise.resolve(addr.text);
  if (geoInflight) return geoInflight;
  const wait = Math.max(0, lastGeoAt + 1100 - Date.now()); // Nominatim limit: 1 request/sec
  geoInflight = new Promise(r => setTimeout(r, wait)).then(async () => {
    lastGeoAt = Date.now();
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=ru&lat=${lat}&lon=${lon}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    addr = { text: formatAddress(j), full: formatAddressFull(j), lat, lon };
    renderAddr();
    return addr.text;
  }).finally(() => { geoInflight = null; });
  return geoInflight;
}

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

async function addressFor(lat, lon) {
  for (let i = 0; i < 2; i++) {
    try {
      await withTimeout(geocode(lat, lon), 6000);
      if (addr.text && dist(lat, lon, addr.lat, addr.lon) < 50) return addrText();
    } catch { break; }
  }
  return addr.text && dist(lat, lon, addr.lat, addr.lon) < 150 ? addrText() : null;
}

// ---------- drawing ----------
function wrap(ctx, text, maxW, maxLines) {
  const words = text.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width <= maxW || !cur) cur = t;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    lines.length = maxLines;
    let last = lines[maxLines - 1];
    while (last && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
    lines[maxLines - 1] = last + '…';
  }
  return lines;
}

// Black info strip under the photo, in the style of traffic-camera fine photos.
const MONO = 'Menlo, "Courier New", monospace';

function stripLayout(w, info) {
  const fs = Math.max(12, Math.round(w * 0.017));
  const padding = Math.round(fs * 0.8);
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = `${fs}px ${MONO}`;
  const maxW = w - padding * 2;
  const lines = [];
  const add = text => lines.push(...wrap(ctx, text, maxW, 3));
  add((info.shot ? `${info.shot}   ` : '') + `Дата: ${info.date}   Время: ${info.time}`);
  if (info.coords) add(`Координаты: ${info.coords}` + (info.extra ? `   ${info.extra}` : ''));
  if (info.heading) add(`Направление съёмки: ${info.heading}`);
  add('Адрес: ' + (info.address || (info.coords ? 'не определён' : 'местоположение не определено')));
  if (info.plate) add(`Госномер: ${info.plate}`);
  if (info.comment) add(`${findViolation(info.comment) ? 'Нарушение' : 'Комментарий'}: ${info.comment}`);
  const lineH = Math.round(fs * 1.35);
  return { fs, padding, lineH, lines, height: lines.length * lineH + padding * 2 };
}

function drawStrip(ctx, y0, w, L) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, y0, w, L.height);
  ctx.fillStyle = '#fff';
  ctx.font = `${L.fs}px ${MONO}`;
  ctx.textBaseline = 'top';
  L.lines.forEach((t, i) => ctx.fillText(t, L.padding, y0 + L.padding + i * L.lineH + L.fs * 0.1));
}

async function loadImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    return img;
  } finally {
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
}

// ---------- EXIF (so Photos shows the date and places the photo on the map) ----------
function makeExif(date, coords) {
  const ascii = s => [...s].map(c => c.charCodeAt(0)).concat(0);
  const exifDate = `${date.getFullYear()}:${pad(date.getMonth() + 1)}:${pad(date.getDate())} ${fmtTime(date)}`;
  const size = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8 };
  const byteLen = e => size[e.type] * e.count;
  const E = (tag, type, vals) => ({ tag, type, vals, count: type === 5 ? vals.length / 2 : vals.length });
  const ratDms = v => {
    v = Math.abs(v);
    const d = Math.floor(v), m = Math.floor((v - d) * 60), s = Math.round(((v - d) * 60 - m) * 60 * 10000);
    return [d, 1, m, 1, s, 10000];
  };

  const ifd0 = [E(0x0112, 3, [1]), E(0x0132, 2, ascii(exifDate)), E(0x8769, 4, [0])];
  const exif = [E(0x9003, 2, ascii(exifDate)), E(0x9011, 2, ascii(tzOffset(date)))];
  let gps = null;
  if (coords) {
    ifd0.push(E(0x8825, 4, [0]));
    gps = [
      E(0x0000, 1, [2, 3, 0, 0]),
      E(0x0001, 2, ascii(coords.latitude >= 0 ? 'N' : 'S')),
      E(0x0002, 5, ratDms(coords.latitude)),
      E(0x0003, 2, ascii(coords.longitude >= 0 ? 'E' : 'W')),
      E(0x0004, 5, ratDms(coords.longitude)),
    ];
    if (coords.altitude != null) {
      gps.push(E(0x0005, 1, [coords.altitude < 0 ? 1 : 0]), E(0x0006, 5, [Math.round(Math.abs(coords.altitude) * 100), 100]));
    }
  }
  const ifdSize = es => es.reduce((s, e) => { const n = byteLen(e); return s + (n > 4 ? n + (n & 1) : 0); }, 2 + es.length * 12 + 4);

  const off0 = 8, offExif = off0 + ifdSize(ifd0), offGps = offExif + ifdSize(exif);
  ifd0.find(e => e.tag === 0x8769).vals = [offExif];
  if (gps) ifd0.find(e => e.tag === 0x8825).vals = [offGps];
  const total = offGps + (gps ? ifdSize(gps) : 0);

  const buf = new ArrayBuffer(total), dv = new DataView(buf);
  dv.setUint16(0, 0x4D4D); dv.setUint16(2, 42); dv.setUint32(4, off0);
  const writeIfd = (off, es) => {
    dv.setUint16(off, es.length);
    let data = off + 2 + es.length * 12 + 4;
    es.forEach((e, i) => {
      const p = off + 2 + i * 12, n = byteLen(e);
      dv.setUint16(p, e.tag); dv.setUint16(p + 2, e.type); dv.setUint32(p + 4, e.count);
      let t = p + 8;
      if (n > 4) { dv.setUint32(p + 8, data); t = data; data += n + (n & 1); }
      e.vals.forEach((v, k) => {
        if (e.type <= 2) dv.setUint8(t + k, v);
        else if (e.type === 3) dv.setUint16(t + k * 2, v);
        else dv.setUint32(t + k * 4, v);
      });
    });
    dv.setUint32(off + 2 + es.length * 12, 0);
  };
  writeIfd(off0, ifd0);
  writeIfd(offExif, exif);
  if (gps) writeIfd(offGps, gps);

  const segLen = 2 + 6 + total;
  const head = new Uint8Array([0xFF, 0xE1, segLen >> 8, segLen & 0xFF, 0x45, 0x78, 0x69, 0x66, 0, 0]);
  return [head, new Uint8Array(buf)];
}

async function withExif(jpegBlob, date, coords) {
  const b = new Uint8Array(await jpegBlob.arrayBuffer());
  let rest = b.subarray(2);
  if (b[2] === 0xFF && b[3] === 0xE0) rest = b.subarray(4 + ((b[4] << 8) | b[5])); // drop JFIF APP0
  return new Blob([new Uint8Array([0xFF, 0xD8]), ...makeExif(date, coords), rest], { type: 'image/jpeg' });
}

// ---------- capture flow ----------
// A series is every photo taken since the result screen was opened from the home screen.
// Photos are numbered "1 из N" only when saving, once N is known.
let shots = [], current = -1, previewUrl = null, unsaved = false;

// The page is paused while the camera is open, so take the direction the phone faces when the shutter button is tapped.
let shotHeading = null;
const rememberHeading = () => { shotHeading = heading != null && Date.now() - headingAt < 5000 ? heading : null; };
$('shootBtn').addEventListener('click', () => { rememberHeading(); shots = []; current = -1; });

const plural = (n, one, few, many) => n % 10 === 1 && n % 100 !== 11 ? one
  : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many;

async function collectShot(file) {
  const now = Date.now();
  const when = new Date(file.lastModified && now - file.lastModified < 600000 ? Math.min(now, file.lastModified) : now);
  let p = fix;
  if ('geolocation' in navigator && (!p || now - p.timestamp > 60000)) p = await freshFix().catch(() => fix);
  const c = p && p.coords;
  const address = c ? await addressFor(c.latitude, c.longitude) : null;
  const near = c && addr.full && dist(c.latitude, c.longitude, addr.lat, addr.lon) < 150;
  return {
    file, when, coords: c, address,
    postal: near ? addr.full : address,
    heading: shotHeading,
    plate: formatPlate($('plate').value),
    comment: $('comment').value.trim(),
    rendered: null,
  };
}

async function renderShot(s, i, n) {
  const key = `${i}/${n}`;
  if (s.rendered && s.rendered.key === key) return s.rendered;
  const img = await loadImage(s.file);
  let w = img.naturalWidth, h = img.naturalHeight;
  const k = Math.min(1, Math.sqrt(15000000 / (w * h))); // iOS canvas size limit, with room for the strip
  w = Math.round(w * k); h = Math.round(h * k);
  const c = s.coords, when = s.when;
  const strip = stripLayout(w, {
    shot: n > 1 ? `Снимок ${i} из ${n}` : null,
    date: fmtDate(when),
    time: `${fmtTime(when)} (UTC${tzOffset(when)})`,
    coords: c ? fmtCoords(c.latitude, c.longitude) : null,
    extra: c && S.extra ? fmtExtra(c) : null,
    heading: s.heading != null ? fmtHeading(s.heading) : null,
    address: s.address,
    plate: s.plate,
    comment: s.comment,
  });
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h + strip.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  drawStrip(ctx, h, w, strip);
  const jpeg = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
  canvas.width = canvas.height = 0;
  const stamp = `${when.getFullYear()}${pad(when.getMonth() + 1)}${pad(when.getDate())}_${fmtTime(when).replace(/:/g, '')}`;
  s.rendered = {
    key,
    blob: await withExif(jpeg, when, c),
    name: `GeoFoto_${stamp}${n > 1 ? `_${i}из${n}` : ''}.jpg`,
  };
  return s.rendered;
}

async function showShot(idx) {
  current = idx;
  const n = shots.length;
  const r = await renderShot(shots[idx], idx + 1, n);
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(r.blob);
  $('preview').src = previewUrl;
  $('seriesCount').textContent = n > 1 ? `${n} ${plural(n, 'снимок', 'снимка', 'снимков')} в серии` : '';
  $('saveBtn').textContent = n > 1 ? `Сохранить (${n})` : 'Сохранить';
  $('seriesHint').textContent = n > 1
    ? `При сохранении снимки получат номера «1 из ${n}» … «${n} из ${n}».`
    : 'Нужно ещё фото этого нарушения (номер, знак)? Нажмите «Ещё фото».';
  $('result').hidden = false;
  resetScroll();
}

$('cam').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  resetScroll();
  $('busy').hidden = false;
  try {
    shots.push(await collectShot(file));
    unsaved = true;
    await showShot(shots.length - 1);
  } catch (err) {
    alert('Ошибка обработки фото: ' + err.message);
  } finally {
    $('busy').hidden = true;
  }
});

$('saveBtn').onclick = async () => {
  const n = shots.length;
  const files = [];
  $('busy').hidden = false;
  try {
    for (let i = 0; i < n; i++) {
      $('busy').textContent = n > 1 ? `Подготовка снимка ${i + 1} из ${n}…` : 'Подготовка…';
      const r = await renderShot(shots[i], i + 1, n);
      files.push(new File([r.blob], r.name, { type: 'image/jpeg' }));
    }
  } catch (err) {
    alert('Ошибка обработки фото: ' + err.message);
    return;
  } finally {
    $('busy').hidden = true;
    $('busy').textContent = 'Обработка…';
  }
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); unsaved = false; }
    catch (e) { if (e.name !== 'AbortError') alert(e.message); }
  } else {
    for (const f of files) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f); a.download = f.name; a.click();
    }
    unsaved = false;
  }
};

$('againBtn').onclick = () => { rememberHeading(); $('cam').click(); };

$('deleteBtn').onclick = async () => {
  if (!confirm('Удалить этот снимок из серии?')) return;
  shots.splice(current, 1);
  if (!shots.length) { unsaved = false; $('result').hidden = true; resetScroll(); return; }
  $('busy').hidden = false;
  try { await showShot(Math.min(current, shots.length - 1)); } finally { $('busy').hidden = true; }
};

$('closeBtn').onclick = () => {
  if (unsaved && !confirm('Снимки ещё не сохранены. Закрыть без сохранения?')) return;
  shots = []; current = -1; unsaved = false;
  $('result').hidden = true;
  resetScroll();
};

// ---------- complaint text ----------
function buildComplaint(list) {
  const s = list[0], d = s.when;
  const place = s.postal
    ? `по адресу: ${s.postal}` + (s.coords ? ` (координаты ${s.coords.latitude.toFixed(6)}, ${s.coords.longitude.toFixed(6)})` : '')
    : s.coords ? `в точке с координатами ${s.coords.latitude.toFixed(6)}, ${s.coords.longitude.toFixed(6)}` : 'по адресу: [укажите адрес]';
  const plate = (list.find(x => x.plate) || {}).plate;
  const comment = (list.find(x => x.comment) || {}).comment || '';
  const car = `транспортное средство с государственным регистрационным знаком ${plate || '[госномер]'}`;
  const v = findViolation(comment);
  const what = v ? `${car} ${v.act}.` : `${car}: ${comment || '[опишите нарушение]'}.`;
  const n = list.length;
  return `${fmtDate(d)} в ${pad(d.getHours())}:${pad(d.getMinutes())} ${place} ${what}\n\n` +
    'Прошу провести проверку по данному факту и привлечь водителя (собственника) транспортного средства ' +
    'к административной ответственности.\n\n' +
    `Фотоматериалы с указанием даты, времени и координат места съёмки прилагаются (${n} ${plural(n, 'снимок', 'снимка', 'снимков')}).`;
}

$('complaintBtn').onclick = () => {
  $('complaintText').value = buildComplaint(shots);
  $('complaintCopy').textContent = 'Скопировать';
  $('complaint').hidden = false;
};

$('complaintClose').onclick = () => { $('complaint').hidden = true; resetScroll(); };
$('complaintCopy').onclick = async () => {
  const t = $('complaintText');
  try {
    await navigator.clipboard.writeText(t.value);
  } catch {
    t.select();
    document.execCommand('copy');
    t.blur();
  }
  $('complaintCopy').textContent = 'Скопировано ✓';
};

// ---------- build stamp (filled in by the GitHub Actions deploy) ----------
const BUILD = { sha: '__BUILD_SHA__', date: '__BUILD_DATE__' };
if (BUILD.sha.indexOf('__') === 0) {
  $('build').textContent = 'локальная версия';
} else {
  const d = new Date(BUILD.date);
  $('build').textContent = `обновлено ${fmtDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())} · ${BUILD.sha}`;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
